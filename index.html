<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Adventurers Chronicles</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#1a1a2e; overflow:hidden; font-family:sans-serif; }
  #game { width:100vw; height:100vh; }
  .hud { position:fixed; top:8px; left:8px; color:#fff; font-size:14px; z-index:10; text-shadow:1px 1px 2px #000; }
  .bar { width:160px; height:14px; background:#333; border:2px solid #000; border-radius:6px; margin:3px 0; overflow:hidden; }
  .bar > div { height:100%; transition:width .2s; }
  #hpFill { background:#e74c3c; width:100%; }
  #mpFill { background:#3498db; width:100%; }
  #xpFill { background:#f1c40f; width:0%; }
  #joystick { position:fixed; bottom:30px; left:30px; width:120px; height:120px; background:rgba(255,255,255,.15); border-radius:50%; z-index:10; touch-action:none; }
  #stick { position:absolute; top:35px; left:35px; width:50px; height:50px; background:rgba(255,255,255,.5); border-radius:50%; }
  #atkBtn { position:fixed; bottom:50px; right:40px; width:80px; height:80px; background:rgba(231,76,60,.7); border-radius:50%; color:#fff; font-size:14px; border:3px solid #fff; z-index:10; }
  .skillBtn { position:fixed; width:60px; height:60px; border-radius:50%; color:#fff; font-size:11px; border:3px solid #fff; z-index:10; display:none; }
  #skill1 { bottom:150px; right:45px; background:rgba(155,89,182,.8); }
  #skill2 { bottom:135px; right:130px; background:rgba(52,152,219,.8); }
  #skill3 { bottom:55px; right:135px; background:rgba(46,204,113,.8); }
  .cd { position:absolute; inset:0; background:rgba(0,0,0,.6); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; }
</style>
</head>
<body>
<div class="hud">
  <div id="lvl">Nivel 1</div>
  <div>HP <div class="bar"><div id="hpFill"></div></div></div>
  <div>MP <div class="bar"><div id="mpFill"></div></div></div>
  <div>XP <div class="bar"><div id="xpFill"></div></div></div>
  <div id="gold">Oro: 0</div>
</div>
<div id="game"></div>
<div id="joystick"><div id="stick"></div></div>
<button id="atkBtn">ATACAR</button>
<button class="skillBtn" id="skill1">Golpe<br>Feroz</button>
<button class="skillBtn" id="skill2">Cura</button>
<button class="skillBtn" id="skill3">Onda</button>

<script>
// ====== ESTADO DEL JUGADOR ======
const player = {
  hp:100, maxHp:100, mp:50, maxMp:50, level:1, xp:0, xpNext:20,
  gold:0, speed:180, attack:25
};

// ====== DEFINICIÓN DE HABILIDADES ======
// Se desbloquean al llegar al nivel indicado
const skills = {
  skill1:{ name:'Golpe Feroz', unlockLvl:2, mpCost:10, cd:2000, ready:true, learned:false },
  skill2:{ name:'Cura',        unlockLvl:3, mpCost:15, cd:5000, ready:true, learned:false },
  skill3:{ name:'Onda Mágica', unlockLvl:5, mpCost:20, cd:4000, ready:true, learned:false }
};

// ====== JOYSTICK ======
let moveVec = {x:0,y:0};
const joy=document.getElementById('joystick'), stick=document.getElementById('stick');
let joyActive=false;
function joyMove(cx,cy){
  const r=joy.getBoundingClientRect();
  let dx=cx-(r.left+r.width/2), dy=cy-(r.top+r.height/2);
  const dist=Math.min(Math.hypot(dx,dy),45), ang=Math.atan2(dy,dx);
  const nx=Math.cos(ang)*dist, ny=Math.sin(ang)*dist;
  stick.style.transform=`translate(${nx}px,${ny}px)`;
  moveVec.x=nx/45; moveVec.y=ny/45;
}
function joyEnd(){ joyActive=false; moveVec={x:0,y:0}; stick.style.transform='translate(0,0)'; }
joy.addEventListener('touchstart',e=>{joyActive=true; joyMove(e.touches[0].clientX,e.touches[0].clientY);});
joy.addEventListener('touchmove',e=>{e.preventDefault(); joyMove(e.touches[0].clientX,e.touches[0].clientY);});
joy.addEventListener('touchend',joyEnd);
joy.addEventListener('mousedown',e=>{joyActive=true; joyMove(e.clientX,e.clientY);});
window.addEventListener('mousemove',e=>{if(joyActive)joyMove(e.clientX,e.clientY);});
window.addEventListener('mouseup',()=>{if(joyActive)joyEnd();});

// ====== BOTONES DE ACCIÓN ======
let wantAttack=false, wantSkill=null;
function bindBtn(id, cb){
  const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{e.preventDefault(); cb();});
  el.addEventListener('mousedown',()=>cb());
}
bindBtn('atkBtn', ()=>wantAttack=true);
bindBtn('skill1', ()=>wantSkill='skill1');
bindBtn('skill2', ()=>wantSkill='skill2');
bindBtn('skill3', ()=>wantSkill='skill3');

// ====== ESCENA ======
class MainScene extends Phaser.Scene {
  constructor(){ super('main'); }
  create(){
    this.add.grid(0,0,4000,4000,64,64,0x2e7d32,1,0x256428,0.4).setOrigin(0);
    this.hero=this.add.rectangle(500,500,28,40,0xf5deb3).setStrokeStyle(2,0x000);
    this.physics.add.existing(this.hero);
    this.hero.body.setCollideWorldBounds(true);
    this.physics.world.setBounds(0,0,4000,4000);
    this.cameras.main.startFollow(this.hero,true,0.1,0.1).setBounds(0,0,4000,4000);
    this.monsters=this.physics.add.group();
    for(let i=0;i<12;i++) this.spawnMonster();
    this.cursors=this.input.keyboard.createCursorKeys();
    this.keys=this.input.keyboard.addKeys('W,A,S,D,SPACE,ONE,TWO,THREE');
    // Regenerar MP con el tiempo
    this.time.addEvent({delay:1000, loop:true, callback:()=>{
      if(player.mp<player.maxMp){ player.mp=Math.min(player.maxMp,player.mp+3); updateHUD(); }
    }});
  }
  spawnMonster(){
    const x=Phaser.Math.Between(200,3800), y=Phaser.Math.Between(200,3800);
    const m=this.add.circle(x,y,16,0x4caf50).setStrokeStyle(2,0x1b5e20);
    this.physics.add.existing(m);
    m.hp=40; m.maxHp=40; m.xpReward=8; m.goldReward=3;
    this.monsters.add(m); return m;
  }
  floatText(x,y,txt,color='#fff'){
    const t=this.add.text(x,y,txt,{fontSize:'18px',color,fontStyle:'bold'}).setOrigin(0.5);
    this.tweens.add({targets:t,y:y-40,alpha:0,duration:700,onComplete:()=>t.destroy()});
  }
  damageMonster(m,dmg,color='#ffeb3b'){
    m.hp-=dmg;
    this.floatText(m.x,m.y-20,dmg,color);
    this.tweens.add({targets:m,scaleX:1.3,scaleY:0.7,duration:80,yoyo:true});
    if(m.hp<=0) this.killMonster(m);
  }
  attack(){
    let hit=false;
    this.monsters.getChildren().forEach(m=>{
      if(Phaser.Math.Distance.Between(this.hero.x,this.hero.y,m.x,m.y)<70){
        hit=true; this.damageMonster(m,player.attack);
      }
    });
    if(hit) this.tweens.add({targets:this.hero,scaleX:1.2,duration:60,yoyo:true});
  }
  // ====== USO DE HABILIDADES ======
  useSkill(id){
    const s=skills[id];
    if(!s.learned || !s.ready || player.mp<s.mpCost) return;
    player.mp-=s.mpCost; s.ready=false;
    startCooldown(id, s.cd);

    if(id==='skill1'){ // Golpe Feroz: gran daño cercano
      this.monsters.getChildren().forEach(m=>{
        if(Phaser.Math.Distance.Between(this.hero.x,this.hero.y,m.x,m.y)<90)
          this.damageMonster(m, player.attack*2.5, '#e91e63');
      });
      const fx=this.add.circle(this.hero.x,this.hero.y,20,0x9b59b6,0.6);
      this.tweens.add({targets:fx,radius:90,alpha:0,duration:400,onComplete:()=>fx.destroy()});
    }
    if(id==='skill2'){ // Cura
      player.hp=Math.min(player.maxHp,player.hp+50);
      this.floatText(this.hero.x,this.hero.y-40,'+50 HP','#2ecc71');
      const fx=this.add.circle(this.hero.x,this.hero.y,15,0x2ecc71,0.5);
      this.tweens.add({targets:fx,radius:60,alpha:0,duration:600,onComplete:()=>fx.destroy()});
    }
    if(id==='skill3'){ // Onda Mágica: daño en área grande
      const fx=this.add.circle(this.hero.x,this.hero.y,10,0x3498db,0.5);
      this.tweens.add({targets:fx,radius:180,alpha:0,duration:500,onComplete:()=>fx.destroy()});
      this.monsters.getChildren().forEach(m=>{
        if(Phaser.Math.Distance.Between(this.hero.x,this.hero.y,m.x,m.y)<180)
          this.damageMonster(m, player.attack*1.5, '#3498db');
      });
    }
    updateHUD();
  }
  killMonster(m){
    player.xp+=m.xpReward; player.gold+=m.goldReward;
    this.floatText(m.x,m.y-40,'+'+m.xpReward+' XP','#4fc3f7');
    const loot=this.add.circle(m.x,m.y,6,0xffd700).setStrokeStyle(1,0x8a6d00);
    this.tweens.add({targets:loot,y:m.y-15,duration:300,yoyo:true,repeat:2,
      onComplete:()=>this.tweens.add({targets:loot,alpha:0,duration:400,onComplete:()=>loot.destroy()})});
    m.destroy(); this.checkLevelUp(); updateHUD();
    this.time.delayedCall(2000,()=>this.spawnMonster());
  }
  checkLevelUp(){
    while(player.xp>=player.xpNext){
      player.xp-=player.xpNext; player.level++;
      player.xpNext=Math.floor(player.xpNext*1.5);
      player.maxHp+=20; player.hp=player.maxHp;
      player.maxMp+=10; player.mp=player.maxMp;
      player.attack+=5;
      this.floatText(this.hero.x,this.hero.y-50,'¡NIVEL '+player.level+'!','#00e676');
      this.checkNewSkills();
    }
  }
  // ====== APRENDER HABILIDADES ======
  checkNewSkills(){
    for(const id in skills){
      const s=skills[id];
      if(!s.learned && player.level>=s.unlockLvl){
        s.learned=true;
        document.getElementById(id).style.display='block';
        this.floatText(this.hero.x,this.hero.y-80,'¡Nueva habilidad: '+s.name+'!','#ffd700');
      }
    }
  }
  update(){
    let vx=moveVec.x, vy=moveVec.y;
    if(this.cursors.left.isDown||this.keys.A.isDown) vx=-1;
    if(this.cursors.right.isDown||this.keys.D.isDown) vx=1;
    if(this.cursors.up.isDown||this.keys.W.isDown) vy=-1;
    if(this.cursors.down.isDown||this.keys.S.isDown) vy=1;
    const len=Math.hypot(vx,vy)||1;
    this.hero.body.setVelocity(vx/len*player.speed, vy/len*player.speed);

    if(wantAttack||Phaser.Input.Keyboard.JustDown(this.keys.SPACE)){ this.attack(); wantAttack=false; }
    if(wantSkill){ this.useSkill(wantSkill); wantSkill=null; }
    if(Phaser.Input.Keyboard.JustDown(this.keys.ONE)) this.useSkill('skill1');
    if(Phaser.Input.Keyboard.JustDown(this.keys.TWO)) this.useSkill('skill2');
    if(Phaser.Input.Keyboard.JustDown(this.keys.THREE)) this.useSkill('skill3');
  }
}

// ====== COOLDOWN VISUAL ======
function startCooldown(id, ms){
  const btn=document.getElementById(id);
  const cd=document.createElement('div'); cd.className='cd';
  btn.appendChild(cd);
  let remain=ms/1000; cd.textContent=remain.toFixed(0);
  const iv=setInterval(()=>{ remain-=1; cd.textContent=remain.toFixed(0); if(remain<=0){clearInterval(iv);} },1000);
  setTimeout(()=>{ skills[id].ready=true; cd.remove(); }, ms);
}

// ====== HUD ======
function updateHUD(){
  document.getElementById('lvl').textContent='Nivel '+player.level;
  document.getElementById('gold').textContent='Oro: '+player.gold;
  document.getElementById('hpFill').style.width=(player.hp/player.maxHp*100)+'%';
  document.getElementById('mpFill').style.width=(player.mp/player.maxMp*100)+'%';
  document.getElementById('xpFill').style.width=(player.xp/player.xpNext*100)+'%';
}

// ====== ARRANQUE ======
new Phaser.Game({
  type:Phaser.AUTO, parent:'game', backgroundColor:'#2e7d32',
  scale:{mode:Phaser.Scale.RESIZE,width:'100%',height:'100%'},
  physics:{default:'arcade',arcade:{gravity:{y:0}}},
  scene:MainScene
});
updateHUD();
</script>
</body>
</html>
